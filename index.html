<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(180deg, #ffc1d1 0%, #ffafbd 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #content {
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        .emoji-display {
            font-size: 100px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 10px 20px;
        }

        .subtext {
            font-size: 1.1rem;
            color: #fff;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 150px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 1000;
        }

        #noBtn {
            background-color: white;
            color: #ff4d6d;
            position: relative;
        }

        /* Cry Emoji Animation */
        .cry-particle {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            animation: flyAway 1s forwards;
            z-index: 2000;
        }

        @keyframes flyAway {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw), var(--th)) scale(1.5); opacity: 0; }
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <div id="content">
        <div class="emoji-display" id="emoji">🤗</div>
        <h1 id="questionText">DO you love me? 🤗</h1>
        <div class="subtext" id="subtext">~Maaz is all yours</div>

        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const questionText = document.getElementById('questionText');
        const subtext = document.getElementById('subtext');
        const emojiDisplay = document.getElementById('emoji');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const content = document.getElementById('content');

        let step = 1;
        let yesScale = 1;

        const slides = {
            1: { q: "DO you love me? 🤗", s: "~Maaz is all yours", e: "🤗" },
            2: { q: "Please think again! 🙄", s: "itni jaldi nahi matt bolo 😟", e: "🙄" },
            3: { q: "Ek aur baar Soch lo! 😟", s: "kyu aisa kar rahi ho 😟", e: "😟" },
            4: { q: "Man jao na! Kitna bhav khaogi 😭", s: "bhut glt baat hai yaar 😭", e: "😭" }
        };

        function spawnCry(e) {
            // Support both click and touch events
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            for(let i=0; i<6; i++) {
                const cry = document.createElement('div');
                cry.className = 'cry-particle';
                cry.innerText = '😭';
                cry.style.left = x + 'px';
                cry.style.top = y + 'px';
                
                // Randomize direction
                cry.style.setProperty('--tw', (Math.random() * 200 - 100) + 'px');
                cry.style.setProperty('--th', (Math.random() * -200 - 50) + 'px');
                
                document.body.appendChild(cry);
                setTimeout(() => cry.remove(), 1000);
            }
        }

        function updateContent() {
            questionText.innerText = slides[step].q;
            subtext.innerText = slides[step].s;
            emojiDisplay.innerText = slides[step].e;
        }

        function moveNoButton() {
            const padding = 80;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * maxX) + 40;
            const randomY = Math.floor(Math.random() * maxY) + 40;

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesScale += 0.4;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        noBtn.addEventListener('click', (e) => {
            spawnCry(e);
            if (step < 4) {
                step++;
                updateContent();
            } else {
                moveNoButton();
            }
        });

        noBtn.addEventListener('touchstart', (e) => {
            spawnCry(e);
            if (step === 4) {
                e.preventDefault();
                moveNoButton();
            }
        });

        yesBtn.addEventListener('click', () => {
            content.innerHTML = `
                <div class="emoji-display">💖</div>
                <h1>Hehe, I knew it! ❤️</h1>
                <p style="color:white; font-size:1.3rem; font-weight:bold;">Love you a lot 🥰</p>
            `;
            setInterval(createHeart, 300);
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
